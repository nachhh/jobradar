# Alembic configuration. The database URL is NOT set here: migrations/env.py reads it from
# the app settings (DATABASE_URL), so credentials stay out of the repository.

[alembic]
script_location = %(here)s/migrations
# Migration file names: date plus a slug, so they sort chronologically in the folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# No prepend_sys_path: `jobradar` is installed into the venv by uv, so migrations import it like any package.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
